<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syed — Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { margin: 0; }

        .hero-grid {
            background-image:
                linear-gradient(rgba(15,23,42,.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(15,23,42,.045) 1px, transparent 1px);
            background-size: 48px 48px;
        }

        .hero-orb {
            animation: floatOrb 8s ease-in-out infinite;
        }

        @keyframes floatOrb {
            0%,100% { transform: translate3d(0,0,0) scale(1); }
            50% { transform: translate3d(25px,-20px,0) scale(1.08); }
        }

        .reveal {
            opacity: 0;
            transform: translateY(45px);
            animation: reveal .8s cubic-bezier(.22,1,.36,1) forwards;
        }

        @keyframes reveal {
            to { opacity: 1; transform: translateY(0); }
        }

        .month-card {
            position: relative;
            isolation: isolate;
            min-height: 330px;
            overflow: hidden;
            border-radius: 28px;
            transform: translateY(0);
            transition: transform .55s cubic-bezier(.22,1,.36,1),
                        box-shadow .55s ease;
        }

        .month-card::before {
            content: "";
            position: absolute;
            inset: -40%;
            z-index: -2;
            background: var(--gradient);
            animation: gradientMove 9s ease-in-out infinite alternate;
        }

        .month-card::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            background: radial-gradient(circle at 20% 20%, rgba(255,255,255,.35), transparent 30%);
            pointer-events: none;
        }

        @keyframes gradientMove {
            from { transform: translate3d(-7%, -4%, 0) rotate(0deg) scale(1); }
            to { transform: translate3d(7%, 5%, 0) rotate(5deg) scale(1.12); }
        }

        .month-card:hover {
            transform: translateY(-12px) rotateX(2deg);
            box-shadow: 0 28px 60px rgba(15,23,42,.18);
        }

        .portfolio-modal {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity .3s ease, visibility .3s ease;
        }

        .portfolio-modal.is-open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .portfolio-modal-panel {
            transform: translateY(18px) scale(.98);
            transition: transform .35s cubic-bezier(.22,1,.36,1);
        }

        .portfolio-modal.is-open .portfolio-modal-panel {
            transform: translateY(0) scale(1);
        }

        .coming-soon {
            min-height: 420px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .portfolio-carousel {
            position: relative;
        }

        .portfolio-track {
            display: flex;
            transition: transform .45s cubic-bezier(.22,1,.36,1);
        }

        .portfolio-slide {
            flex: 0 0 100%;
            min-width: 100%;
        }

        .carousel-arrow {
            position: absolute;
            top: 50%;
            z-index: 5;
            transform: translateY(-50%);
            width: 42px;
            height: 42px;
            border-radius: 9999px;
            border: 1px solid rgba(255,255,255,.18);
            background: rgba(15,23,42,.72);
            color: white;
            backdrop-filter: blur(10px);
            transition: .2s ease;
        }

        .carousel-arrow:hover {
            background: rgba(255,255,255,.16);
            transform: translateY(-50%) scale(1.05);
        }

        .month-number {
            transition: transform .7s cubic-bezier(.22,1,.36,1), opacity .5s ease;
        }

        .month-card:hover .month-number {
            transform: translateY(-22px) scale(.9);
            opacity: .25;
        }

        .month-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(2,6,23,.88) 0%, rgba(2,6,23,.48) 45%, rgba(2,6,23,0) 100%);
            transform: translateY(100%);
            transition: transform .6s cubic-bezier(.22,1,.36,1);
        }

        .month-card:hover .month-overlay {
            transform: translateY(0);
        }

        .month-label {
            position: absolute;
            left: 28px;
            right: 28px;
            bottom: 26px;
            transform: translateY(55px);
            opacity: 0;
            transition: transform .65s cubic-bezier(.22,1,.36,1) .05s,
                        opacity .45s ease .05s;
        }

        .month-card:hover .month-label {
            transform: translateY(0);
            opacity: 1;
        }

        .shine {
            position: absolute;
            top: -100%;
            left: -30%;
            width: 55%;
            height: 300%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.22), transparent);
            transform: rotate(20deg);
            transition: left .9s ease;
            pointer-events: none;
        }

        .month-card:hover .shine {
            left: 120%;
        }

        .scroll-line {
            animation: scrollPulse 1.8s ease-in-out infinite;
        }

        @keyframes scrollPulse {
            0%,100% { transform: scaleY(.65); opacity: .35; }
            50% { transform: scaleY(1); opacity: 1; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body class="bg-slate-950 text-white antialiased">

    <!-- July Video Modal -->
    <div id="julyVideoModal" class="portfolio-modal fixed inset-0 z-[110] flex items-center justify-center bg-slate-950/95 p-5 backdrop-blur-md"

    <!-- Portfolio Gallery Modal -->
    <div id="portfolioModal" class="portfolio-modal fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/90 p-5 backdrop-blur-md"
         onclick="closePortfolio(event)">
        <div class="portfolio-modal-panel w-full max-w-5xl rounded-3xl border border-white/10 bg-slate-900 p-5 shadow-2xl sm:p-8"
             onclick="event.stopPropagation()">
            <div class="mb-6 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-[.3em] text-white/40">Portfolio</p>
                    <h2 id="portfolioTitle" class="mt-1 text-3xl font-black text-white">July</h2>
                </div>
                <button type="button" onclick="closePortfolio()" class="rounded-full border border-white/10 px-4 py-2 text-sm text-white/70 transition hover:bg-white/10 hover:text-white" aria-label="Close portfolio">
                    Close

            </div>

            <div class="portfolio-carousel relative overflow-hidden rounded-2xl">
                <div id="portfolioTrack" class="portfolio-track"></div>
                <button id="prevPortfolioButton" type="button" class="carousel-arrow left-3 hidden" onclick="changePortfolioSlide(-1)" aria-label="Previous image">‹</button>
                <button id="nextPortfolioButton" type="button" class="carousel-arrow right-3 hidden" onclick="changePortfolioSlide(1)" aria-label="Next image">›</button>
            </div>
            <div id="portfolioDots" class="mt-5 flex justify-center gap-2"></div>
            <p id="portfolioCounter" class="mt-3 text-center text-xs uppercase tracking-[.25em] text-white/30"></p>
        </div>
    </div>

    <footer class="border-t border-white/10 bg-slate-950 py-8 text-center">
        <span class="text-sm font-medium text-white/45">&copy; 2026 Studio Design.</span>
    </footer>

    <script>
        const portfolioData = {
            July: [
                "https://images.unsplash.com/photo-1513364776144-60967b0f800f?auto=format&fit=crop&w=1200&q=85",
                "https://images.unsplash.com/photo-1547891654-e66ed7ebb968?auto=format&fit=crop&w=1200&q=85",
                "https://images.unsplash.com/photo-1577083552431-6e5fd01aa342?auto=format&fit=crop&w=1200&q=85",
                "https://images.unsplash.com/photo-1549490349-8643362247b5?auto=format&fit=crop&w=1200&q=85",
                "https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?auto=format&fit=crop&w=1200&q=85"
            ],
            August: [
                "https://images.unsplash.com/photo-1577083288073-40892c0860a4?auto=format&fit=crop&w=1200&q=85",
                "https://images.unsplash.com/photo-1541961017774-22349e4a1262?auto=format&fit=crop&w=1200&q=85",
                "https://images.unsplash.com/photo-1561214115-f2f134cc4912?auto=format&fit=crop&w=1200&q=85",
                "https://images.unsplash.com/photo-1549490349-8643362247b5?auto=format&fit=crop&w=1200&q=85",
                "https://images.unsplash.com/photo-1577083552431-6e5fd01aa342?auto=format&fit=crop&w=1200&q=85"
            ],
            September: [
                "https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?auto=format&fit=crop&w=1200&q=85",
                "https://images.unsplash.com/photo-1577083288073-40892c0860a4?auto=format&fit=crop&w=1200&q=85",
                "https://images.unsplash.com/photo-1561839561-b13bcfe95249?auto=format&fit=crop&w=1200&q=85",
                "https://images.unsplash.com/photo-1561214115-f2f134cc4912?auto=format&fit=crop&w=1200&q=85",
                "https://images.unsplash.com/photo-1541961017774-22349e4a1262?auto=format&fit=crop&w=1200&q=85"
            ],
            October: [
                "https://images.unsplash.com/photo-1549490349-8643362247b5?auto=format&fit=crop&w=1200&q=85",
                "https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?auto=format&fit=crop&w=1200&q=85",
                "https://images.unsplash.com/photo-1513364776144-60967b0f800f?auto=format&fit=crop&w=1200&q=85",
                "https://images.unsplash.com/photo-1577083552431-6e5fd01aa342?auto=format&fit=crop&w=1200&q=85",
                "https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?auto=format&fit=crop&w=1200&q=85"
            ],
            November: [
                "https://images.unsplash.com/photo-1561839561-b13bcfe95249?auto=format&fit=crop&w=1200&q=85",
                "https://images.unsplash.com/photo-1561214115-f2f134cc4912?auto=format&fit=crop&w=1200&q=85",
                "https://images.unsplash.com/photo-1541961017774-22349e4a1262?auto=format&fit=crop&w=1200&q=85",
                "https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?auto=format&fit=crop&w=1200&q=85",
                "https://images.unsplash.com/photo-1577083288073-40892c0860a4?auto=format&fit=crop&w=1200&q=85"
            ],
            December: [
                "https://images.unsplash.com/photo-1541961017774-22349e4a1262?auto=format&fit=crop&w=1200&q=85",
                "https://images.unsplash.com/photo-1513364776144-60967b0f800f?auto=format&fit=crop&w=1200&q=85",
                "https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?auto=format&fit=crop&w=1200&q=85",
                "https://images.unsplash.com/photo-1561839561-b13bcfe95249?auto=format&fit=crop&w=1200&q=85",
                "https://images.unsplash.com/photo-1549490349-8643362247b5?auto=format&fit=crop&w=1200&q=85"
            ]
        };

        let currentPortfolioMonth = "";
        let currentPortfolioIndex = 0;

        function renderPortfolioCarousel() {
            const images = portfolioData[currentPortfolioMonth] || [];
            const track = document.getElementById("portfolioTrack");
            const dots = document.getElementById("portfolioDots");
            const counter = document.getElementById("portfolioCounter");

            track.style.transform = `translateX(-${currentPortfolioIndex * 100}%)`;
            track.innerHTML = images.map((src, index) => `
                <div class="portfolio-slide">
                    <div class="aspect-[16/10] overflow-hidden rounded-2xl bg-white/5">
                        <img src="${src}" alt="${currentPortfolioMonth} portfolio image ${index + 1}"
                             class="h-full w-full object-cover"
                             onerror="this.style.display='none'; this.parentElement.innerHTML='<div class="flex h-full items-center justify-center text-xs uppercase tracking-[.2em] text-white/25">Image unavailable</div>';">
                    </div>
                </div>
            `).join("");

            dots.innerHTML = images.map((_, index) => `
                <button type="button"
                        onclick="goToPortfolioSlide(${index})"
                        class="h-2 rounded-full transition-all ${index === currentPortfolioIndex ? "w-7 bg-white" : "w-2 bg-white/25"}"
                        aria-label="Go to image ${index + 1}"></button>
            `).join("");

            counter.textContent = `${currentPortfolioIndex + 1} / ${images.length}`;
        }

        function openPortfolio(month) {
            if (month === "July") {
                document.getElementById("julyVideoModal").classList.add("is-open");
                const julyVideo = document.getElementById("julyPortfolioVideo");
                if (julyVideo) julyVideo.currentTime = 0;
                document.body.style.overflow = "hidden";
                return;
            }

            const modal = document.getElementById("portfolioModal");
            document.getElementById("portfolioTitle").textContent = month;

            // All months except July are currently unavailable.
            document.getElementById("portfolioTrack").innerHTML = `
                <div class="portfolio-slide">
                    <div class="coming-soon rounded-2xl border border-white/10 bg-white/[.03]">
                        <div>
                            <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full border border-white/10 bg-white/5">
                                <span class="text-2xl">✦</span>
                            </div>
                            <p class="text-2xl font-black text-white">Coming Soon</p>
                            <p class="mt-2 text-sm text-white/40">${month} portfolio will be available soon.</p>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById("portfolioTrack").style.transform = "translateX(0)";
            document.getElementById("portfolioDots").innerHTML = "";
            document.getElementById("portfolioCounter").textContent = "";

            modal.classList.add("is-open");
            document.body.style.overflow = "hidden";
        }

        function closeJulyVideo(event) {
            if (event && event.target !== event.currentTarget) return;
            document.getElementById("julyVideoModal").classList.remove("is-open");
            const julyVideo = document.getElementById("julyPortfolioVideo");
            if (julyVideo) julyVideo.pause();
            document.body.style.overflow = "";
        }

        function changePortfolioSlide(direction) {
            const images = portfolioData[currentPortfolioMonth] || [];
            if (!images.length) return;
            currentPortfolioIndex = (currentPortfolioIndex + direction + images.length) % images.length;
            renderPortfolioCarousel();
        }

        function goToPortfolioSlide(index) {
            currentPortfolioIndex = index;
            renderPortfolioCarousel();
        }

        function closePortfolio(event) {
            if (event && event.target !== event.currentTarget) return;
            document.getElementById("portfolioModal").classList.remove("is-open");
            document.body.style.overflow = "";
        }

        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
                closePortfolio();
                closeJulyVideo();
            }
        });
    </script>
</body>
</html>
